<head>
  <link
    rel="preload"
    href="/webfonts/RobotoMono-Regular.woff2"
    type="font/woff2"
    as="font"
    crossorigin
  />
  <link
    rel="preload"
    href="/webfonts/LexendDeca-Regular.woff2"
    type="font/woff2"
    as="font"
    crossorigin
  />

  <script>
    document.addEventListener("keydown", function (e) {
      if (e.key == "Escape") e.preventDefault();
    });
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monkeytype Desktop</title>
  <!-- fallback theme colors -->
  <style>
    :root {
      --bg-color: #282a36;
      --main-color: #bd93f9;
      --caret-color: #bd93f9;
      --sub-color: #6272a4;
      --sub-alt-color: #20222c;
      --text-color: #f8f8f2;
      --error-color: #ff5555;
      --error-extra-color: #f1fa8c;
      --colorful-error-color: #ff5555;
      --colorful-error-extra-color: #f1fa8c;
      --nav-focus-opacity: 0;
    }
  </style>
  <link
    rel="icon"
    type="image/x-icon"
    sizes="32x32"
    href="/images/favicon/favicon.ico"
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/images/favicon/apple-touch-icon.png"
  />
  <link
    rel="mask-icon"
    href="/images/favicon/safari-pinned-tab.svg"
    color="#eee"
  />
  <meta name="msapplication-TileColor" content="#e2b714" />
  <meta
    name="msapplication-config"
    content="/images/favicon/browserconfig.xml"
  />
  <meta name="author" content="Sanjay Baskaran" />
  <meta name="darkreader-lock" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    /* 
      Layer order NEEDS to be here and one layer per line.
      This is because vite changes the order of the css imports,
      and the layer definition needs to be at the very very top, otherwise things break.
    */
    @layer normalize;
    @layer theme;
    @layer base;
    @layer components;
    @layer properties;
    @layer vendor;
    @layer custom-styles;
    @layer hidden;
    @layer utilities;
  </style>
  <link rel="stylesheet" class="testtesttest" href="styles/index.scss" />
  <link rel="stylesheet" class="testtest" href="styles/tailwind.css" />
  <link rel="stylesheet" class="test" href="styles/vendor.scss" />

  <style class="customFont" type="text/css"></style>
</head>
