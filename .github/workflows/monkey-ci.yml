name: Desktop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Apple Silicon desktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Prepare frontend config
        working-directory: frontend/src/ts/constants
        run: mv firebase-config-example.ts firebase-config.ts && cp firebase-config.ts firebase-config-live.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build-pkg

      - name: Verify desktop frontend
        run: |
          pnpm --dir frontend exec vitest run __tests__/desktop
          pnpm --dir frontend exec oxlint --type-aware --type-check --format agent src/ts/desktop

      - name: Verify native shell
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --target aarch64-apple-darwin
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --target aarch64-apple-darwin -- -D warnings

      - name: Build Apple Silicon app
        run: pnpm --dir desktop build

      - name: Verify bundle
        run: |
          APP_PATH="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Monkeytype.app"
          file "$APP_PATH/Contents/MacOS/Monkeytype" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          grep -q 'connect-src.*ipc:.*http://ipc.localhost' desktop/src-tauri/tauri.conf.json
